<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Solution SPA · Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#302626;--paper:#fffdf9;--sage:#718174;--line:#e5ddd5;--muted:#857872}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f5f0ea,#eee5de);color:var(--ink);font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(500px,100%);background:rgba(255,253,249,.95);border:1px solid rgba(229,221,213,.9);border-radius:28px;padding:34px;box-shadow:0 30px 70px rgba(69,53,49,.12)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:34px}.brand b{width:54px;height:54px;border-radius:50%;border:1px solid #746965;display:grid;place-items:center;font:32px 'Instrument Serif',serif;font-weight:400}.brand span{font:34px 'Instrument Serif',serif}.brand small{display:block;font:8px 'DM Sans',sans-serif;letter-spacing:.18em;color:#92847e}.eyebrow{font-size:9px;letter-spacing:.18em;color:#8e7d76;font-weight:600}h1{font:48px/1 'Instrument Serif',serif;font-weight:400;margin:8px 0 10px}h1 em{font-weight:400;color:var(--sage)}p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:7px;font-size:10px;margin:13px 0;color:#756963}input{width:100%;border:1px solid var(--line);background:white;padding:14px;border-radius:12px;color:var(--ink);outline:none}input:focus{border-color:#b99589;box-shadow:0 0 0 3px rgba(197,142,130,.12)}button{width:100%;border:0;border-radius:14px;background:var(--ink);color:white;padding:15px;margin-top:10px;font:600 12px 'DM Sans',sans-serif;cursor:pointer}button:disabled{opacity:.55}.status{min-height:18px;text-align:center;font-size:10px;color:#a05d52;margin:14px 0}.back{text-align:center;font-size:10px;color:#776a65}.back a{color:var(--ink);font-weight:600}.website-field{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}@media(max-width:520px){.card{padding:28px 22px}.row{grid-template-columns:1fr}h1{font-size:42px}}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><b>S</b><span>Solution<small>SPA · REGISTRO</small></span></div>
  <span class="eyebrow">NUEVA CLIENTE</span>
  <h1>Crea tu <em>espacio.</em></h1>
  <p>Regístrate una sola vez. Al terminar entrarás directamente a tu perfil para consultar tus datos y tus citas.</p>
  <form id="registerForm">
    <label>Nombre completo<input name="name" type="text" maxlength="120" autocomplete="name" required></label>
    <div class="row"><label>WhatsApp<input name="phone" type="tel" maxlength="30" autocomplete="tel" required></label><label>Correo<input name="email" type="email" maxlength="160" autocomplete="email" required></label></div>
    <div class="row"><label>Contraseña<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirma contraseña<input name="password_confirm" type="password" minlength="8" autocomplete="new-password" required></label></div>
    <label class="website-field" aria-hidden="true">Sitio web<input name="website" type="text" tabindex="-1" autocomplete="off"></label>
    <button id="registerButton" type="submit">Crear mi cuenta</button>
    <div class="status" id="status"></div>
  </form>
  <p class="back">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</main>
<script>
(async()=>{try{const r=await fetch('../backend/api/auth.php?action=me',{cache:'no-store'});if(r.ok){const d=await r.json();location.replace(d.user?.role==='client'?'../client/':'./')}}catch(e){}})();
const form=document.getElementById('registerForm'),button=document.getElementById('registerButton'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{
  e.preventDefault();status.textContent='';const fd=new FormData(form);const p=String(fd.get('password')||''),pc=String(fd.get('password_confirm')||'');
  if(p!==pc){status.textContent='Las contraseñas no coinciden';return}
  button.disabled=true;button.textContent='Creando tu espacio…';
  try{
    const r=await fetch('../backend/api/register.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:fd.get('name'),phone:fd.get('phone'),email:fd.get('email'),password:p,password_confirm:pc,website:fd.get('website')||''})});
    const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'No se pudo completar el registro');
    location.replace('../client/');
  }catch(err){status.textContent=err.message;button.disabled=false;button.textContent='Crear mi cuenta'}
});
</script>
</body>
</html>
